<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Class — Sistem Kutipan Yuran PIBG SMK Teluk Bayu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<nav class="topnav">
  <div class="brand">
    <div class="mark">L</div>
    <span class="word">Sistem Kutipan Yuran PIBG SMK Teluk Bayu</span>
    <span class="ctx" id="className">loading…</span>
  </div>
  <div class="topnav-right">
    <span id="whoami"></span>
    <button class="btn btn-sm" onclick="logout()">Log out</button>
  </div>
</nav>

<div class="shell">
  <div class="page-head">
    <div class="eyebrow">Teacher view</div>
    <h1 id="pageTitle">My class</h1>
    <div class="field" style="max-width:220px; margin-top:10px;">
      <label>Year</label>
      <select id="yearSelect"></select>
    </div>
  </div>

  <div class="stats" id="statsRow"></div>

  <div class="card">
    <div class="card-head">
      <h3>Students</h3>
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
        <div class="search-wrap"><input type="text" id="searchBox" placeholder="Search by name…"></div>
        <div style="display:flex; gap:6px;">
          <input type="text" id="newStudentName" placeholder="Add student name…" style="width:170px;">
          <button class="btn btn-sm" id="addStudentBtn">+ Add</button>
        </div>
        <label class="btn btn-sm" for="xlsxInput" style="margin:0;">Upload names (.xlsx)</label>
        <input type="file" id="xlsxInput" accept=".xlsx,.xls" style="display:none;">
      </div>
    </div>
    <div id="studentList"></div>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop" style="display:none;">
  <div class="modal" id="modalBody"></div>
</div>

<div id="printArea"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/common.js"></script>
<script src="js/teacher.js"></script>
</body>
</html>

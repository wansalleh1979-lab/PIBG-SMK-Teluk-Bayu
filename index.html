<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Kutipan Yuran PIBG SMK Teluk Bayu — Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-mark">L</div>
    <div class="eyebrow">Persatuan Ibu Bapa dan Guru</div>
    <h1>Sistem Kutipan Yuran PIBG SMK Teluk Bayu</h1>
    <p class="muted tiny" style="margin-top:6px;">Log in with the account your admin gave you.</p>

    <form id="loginForm" style="margin-top:22px;">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Log in</button>
      <div class="login-err" id="loginErr"></div>
    </form>

    <hr class="divider">
    <p class="tiny muted" id="resetLink" style="text-align:center; cursor:pointer; text-decoration:underline;">Forgot your password?</p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/common.js"></script>
<script>
  // If already logged in, send straight to the right page.
  auth.onAuthStateChanged(async (user)=>{
    if(!user) return;
    try{
      const doc = await db.collection('users').doc(user.uid).get();
      if(doc.exists) window.location.href = doc.data().role + '.html';
    }catch(e){ /* stay on login */ }
  });

  document.getElementById('loginForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('loginErr');
    err.textContent = '';
    btn.disabled = true; btn.textContent = 'Logging in…';
    try{
      const cred = await auth.signInWithEmailAndPassword(email, password);
      const doc = await db.collection('users').doc(cred.user.uid).get();
      if(!doc.exists){
        err.textContent = 'This account has no role assigned yet. Ask your admin.';
        await auth.signOut();
      }else{
        window.location.href = doc.data().role + '.html';
      }
    }catch(ex){
      console.error(ex);
      err.textContent = 'Could not log in — check your email and password.';
    }
    btn.disabled = false; btn.textContent = 'Log in';
  });

  document.getElementById('resetLink').addEventListener('click', async ()=>{
    const email = document.getElementById('email').value.trim();
    if(!email){ toast('Type your email above first, then tap this again.'); return; }
    try{
      await auth.sendPasswordResetEmail(email);
      toast('Password reset email sent — check your inbox.');
    }catch(ex){
      toast('Could not send reset email for that address.');
    }
  });
</script>
</body>
</html>
